# Mainly for a consistent Node version and env-var loading across
# developer machines -- the Supabase backend stays remote/hosted per this
# project's shared-DB workflow, this does not attempt to containerize
# Postgres locally.
#
# Usage: cp .env.example .env, fill in real values, then `docker compose up --build`.

services:
  admin-dashboard:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    ports:
      - "8080:80"
