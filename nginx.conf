server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the CSP already applied in vite.config.js for dev/preview --
    # kept identical so behavior doesn't drift between environments.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.gstatic.com https://www.gstatic.com https://apis.google.com; connect-src 'self' https://wufcmtndotfvxvvxkamv.supabase.co wss://wufcmtndotfvxvvxkamv.supabase.co https://res.cloudinary.com https://api.cloudinary.com; img-src * 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" always;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so react-router-dom's client-side routes resolve on a
    # hard refresh / direct link instead of 404ing at the server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache
    # forever; the HTML shell referencing them is not fingerprinted, so it's
    # left on nginx's default (short) caching instead.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
